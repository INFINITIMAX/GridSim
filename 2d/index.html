<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GridSim 2D</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="world"></canvas>
    <div class="panel">
      <strong>GridSim 2D</strong>
      <span class="step">Step 2: inspect and upgrade the hydro</span>
      <div class="group" role="group" aria-label="View">
        <button type="button" data-view="top">Top</button>
        <button type="button" data-view="iso">Isometric</button>
      </div>
      <label class="check"><input type="checkbox" id="grid" /> Grid</label>
    </div>
    <aside class="upgrade" id="upgrade" aria-label="Hydro plant upgrade"></aside>
    <div class="readout" id="readout">Move the mouse over the map</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
