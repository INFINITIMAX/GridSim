<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GridSim map</title></head><body>
<script src="core.js"></script>
<script>
/* GridSim map in the Colorfigures style: the 2D game's map (32 x 20 tiles, the same river, dam and powerhouse),
   drawn as a terrain board you can turn round. A test frame for the look, not the game yet.
   Coordinates: x = depth (toward the viewer-right), y = width (toward the viewer-left), z = up. 1 tile = T units.
   A 2D map cell (col, row) sits at x = row * T, y = (COLS - col) * T, so the map reads the same way as in 2D. */

/* ---------- the map, from 2d/main.ts ---------- */
const COLS = 32, ROWS = 20, T = 10, GROUND = 8;
const RIVER_W = 2;
const RIVER_PTS = [[-1, 6], [9, 6], [9, 10], [20, 10], [20, 13], [33, 13]];
const DAM_AT = { col: 15, row: 10 };
// ?zoom=plant frames the powerhouse and the dam, as the game will after a click on the plant. The engine frames the
// box from the origin to `size`, so when zoomed the whole map is shifted to put the plant in that box.
const ZOOM = new URLSearchParams(location.search).get('zoom') === 'plant';
const ZOOM_BOX = 70;
const RAW = (col, row) => [row * T, (COLS - col) * T];
const PLANT_RAW = RAW(DAM_AT.col + 1.2, DAM_AT.row - 2.2);
const SHIFT = ZOOM ? [PLANT_RAW[0] - ZOOM_BOX / 2, PLANT_RAW[1] - ZOOM_BOX / 2] : [0, 0];
const W3 = (col, row, z = 0) => { const [x, y] = RAW(col, row); return [x - SHIFT[0], y - SHIFT[1], z]; };

/* ---------- materials ---------- */
const GRASS = { l: '#b3d189', m: '#97b96e', d: '#5f7d45' }, GRASS2 = { l: '#a8c87f', m: '#8dae65', d: '#58753f' };
const SOIL = { l: '#c49a6c', m: '#a67c52', d: '#6d4f33' };
const WATER = { l: '#8fc0e8', m: '#6aa3d3', d: '#3f6f9c' };
const CONCRETE = { l: '#ece6d6', m: '#d3cbb7', d: '#9e9682' };
const WALLS = { l: '#f6efdf', m: '#e2d7bf', d: '#b3a588' };
const ROOF = PALS.tomato;
const LEAF = { l: '#8cc46a', m: '#6ea64f', d: '#3c6230' }, LEAF2 = { l: '#a3cf6e', m: '#84b252', d: '#4a6b2c' };
const BARK = { l: '#a77a52', m: '#8a603d', d: '#55391f' };

/* ---------- which tiles are water: within RIVER_W/2 of the river's centre line ---------- */
const segs = RIVER_PTS.slice(1).map((b, i) => [RIVER_PTS[i], b]);
const distToRiver = (x, y) => Math.min(...segs.map(([a, b]) => {
  const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
  const k = Math.max(0, Math.min(1, ((x - a[0]) * dx + (y - a[1]) * dy) / L2));
  return Math.hypot(x - (a[0] + dx * k), y - (a[1] + dy * k));
}));
const isWater = (c, r) => distToRiver(c + 0.5, r + 0.5) <= RIVER_W / 2;

/* ---------- trees: a fixed scatter on grass, away from the river and the plant ---------- */
const TREES = [];
{ let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70 && TREES.length < 34; i++) {
    const c = 1 + rnd() * 30, r = 1 + rnd() * 18;
    if (distToRiver(c, r) < 2.4 || Math.hypot(c - 16, r - 8.5) < 4) continue;
    TREES.push({ c, r, h: 9 + rnd() * 7, kind: rnd() < 0.55 ? 'round' : 'pine' });
  } }

/* ---------- drawing ---------- */
function ground() {
  let s = '';
  const x0 = -SHIFT[0], y0 = -SHIFT[1], x1 = ROWS * T - SHIFT[0], y1 = COLS * T - SHIFT[1];
  // soil sides of the block, then the grass top as tiles (two greens in a checker), then the river cut into it
  s += box(x0, y0, 0, x1, y1, GROUND, SOIL, tone, 1.2);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (isWater(c, r)) continue;
    const m = (r + c) % 2 ? GRASS : GRASS2;
    s += face(pd([W3(c, r, GROUND), W3(c + 1, r, GROUND), W3(c + 1, r + 1, GROUND), W3(c, r + 1, GROUND)]), m.l);
  }
  // water tiles sit 2 units lower, with the bank's face toward the viewer showing the cut
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!isWater(c, r)) continue;
    s += face(pd([W3(c, r, GROUND - 2), W3(c + 1, r, GROUND - 2), W3(c + 1, r + 1, GROUND - 2), W3(c, r + 1, GROUND - 2)]), WATER.l);
  }
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!isWater(c, r)) continue;
    // a bank wall where water meets grass, drawn only when it faces the viewer
    const walls = [[c, r - 1, [-1, 0, 0], [W3(c, r, GROUND - 2), W3(c + 1, r, GROUND - 2), W3(c + 1, r, GROUND), W3(c, r, GROUND)]],
                   [c + 1, r, [0, -1, 0], [W3(c + 1, r, GROUND - 2), W3(c + 1, r + 1, GROUND - 2), W3(c + 1, r + 1, GROUND), W3(c + 1, r, GROUND)]],
                   [c, r + 1, [1, 0, 0], [W3(c, r + 1, GROUND - 2), W3(c + 1, r + 1, GROUND - 2), W3(c + 1, r + 1, GROUND), W3(c, r + 1, GROUND)]],
                   [c - 1, r, [0, 1, 0], [W3(c, r, GROUND - 2), W3(c, r + 1, GROUND - 2), W3(c, r + 1, GROUND), W3(c, r, GROUND)]]];
    for (const [nc, nr, n, q] of walls) {
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS || isWater(nc, nr)) continue;
      const inward = n.map(v => -v);   // the wall faces into the channel
      if (vis(inward)) s += shape(q, tone(inward, SOIL), .6);
    }
  }
  // flow streaks on the water
  for (let i = 0; i < 26; i++) {
    const seg = segs[i % segs.length], k = ((i * 0.37) % 1);
    const [a, b] = seg, x = a[0] + (b[0] - a[0]) * k, y = a[1] + (b[1] - a[1]) * k, along = [b[0] - a[0], b[1] - a[1]], L = Math.hypot(...along);
    const off = ((i * 0.61) % 1 - 0.5) * 1.2, ox = -along[1] / L * off, oy = along[0] / L * off;
    const p0 = W3(x + ox, y + oy, GROUND - 1.9), p1 = W3(x + ox + along[0] / L * 0.8, y + oy + along[1] / L * 0.8, GROUND - 1.9);
    s += `<path d="${pd([p0, p1], false)}" stroke="#e8f4fc" stroke-width="1.4" stroke-linecap="round" fill="none"/>`;
  }
  // the block's outline
  s += hullInk([[x0, y0, 0], [x1, y0, 0], [x1, y1, 0], [x0, y1, 0], [x0, y0, GROUND], [x1, y0, GROUND], [x1, y1, GROUND], [x0, y1, GROUND]], 2.4);
  return s;
}

function tree(t) {
  const [x, y] = W3(t.c, t.r);
  const z0 = GROUND, trunkTop = z0 + t.h * 0.35, leaf = t.c > 16 ? LEAF : LEAF2;
  let s = castShadow([[x - 3, y - 3, z0], [x + 3, y + 3, z0], [x, y, z0 + t.h]], z0);
  s += cyl(x, y, z0, trunkTop + 1, 0.9, BARK, tone, .9, 10);
  if (t.kind === 'pine') {
    s += rod([x, y, trunkTop], [x, y, z0 + t.h], 4.2, leaf, tone, 1.4, 0.3, 14);
  } else {
    // a round crown: a short loft of rings, like a ball
    const rings = [0, 0.35, 0.75, 1].map((f, i) => on(PZ(trunkTop + f * (t.h * 0.65)), ellUV(x, y, [3.6, 5, 4.4, 1.6][i], [3.6, 5, 4.4, 1.6][i], 16)));
    for (let i = 0; i < rings.length - 1; i++) s += loft(rings[i], rings[i + 1], n => tone(n, leaf));
    s += fill(pd(rings[3]), leaf.l) + hullInk(rings.flat(), 1.4);
  }
  return { at: [x, y, z0 + t.h / 2], box: [[x - 5, y - 5, z0], [x + 5, y + 5, z0 + t.h]], svg: s };
}

function plant() {
  const parts = [];
  // the dam across the river at its column, and the powerhouse on the bank beside it
  const [dx0, dy0] = W3(DAM_AT.col + 0.3, DAM_AT.row - 1.4);
  const [dx1, dy1] = W3(DAM_AT.col - 0.3, DAM_AT.row + 1.4);
  const X0 = Math.min(dx0, dx1), X1 = Math.max(dx0, dx1), Y0 = Math.min(dy0, dy1), Y1 = Math.max(dy0, dy1);
  parts.push({ box: [[X0, Y0, GROUND - 2], [X1, Y1, GROUND + 4]], svg: box(X0, Y0, GROUND - 2, X1, Y1, GROUND + 4, CONCRETE, tone, 1.4) });
  // water held behind the dam stands a little higher: a lighter strip upstream
  const [hx0, hy0] = W3(DAM_AT.col + 1.6, DAM_AT.row - 1.4), [hx1, hy1] = W3(DAM_AT.col + 4.4, DAM_AT.row + 1.4);
  // powerhouse: on the bank beside the river, just downstream of the dam
  const [px0, py0] = W3(DAM_AT.col + 0.6, DAM_AT.row - 3.4), [px1, py1] = W3(DAM_AT.col + 2.6, DAM_AT.row - 1.6);
  const PX0 = Math.min(px0, px1), PX1 = Math.max(px0, px1), PY0 = Math.min(py0, py1), PY1 = Math.max(py0, py1), PH = GROUND + 11;
  let h = castShadow([[PX0, PY0, GROUND], [PX1, PY0, GROUND], [PX1, PY1, GROUND], [PX0, PY1, GROUND], [PX0, PY0, PH + 6], [PX1, PY1, PH + 6]], GROUND);
  h += box(PX0, PY0, GROUND, PX1, PY1, PH, WALLS, tone, 1.6);
  // roof: two sloping planes along y with gables
  const RX = (PX0 + PX1) / 2, ov = 1.2;
  const roofA = [[PX0 - ov, PY0 - ov, PH], [PX0 - ov, PY1 + ov, PH], [RX, PY1 + ov, PH + 6], [RX, PY0 - ov, PH + 6]];
  const roofB = [[RX, PY0 - ov, PH + 6], [RX, PY1 + ov, PH + 6], [PX1 + ov, PY1 + ov, PH], [PX1 + ov, PY0 - ov, PH]];
  const gable = y => [[PX0, y, PH], [PX1, y, PH], [RX, y, PH + 6]];
  const nA = norm(cross(sub(roofA[1], roofA[0]), sub(roofA[3], roofA[0]))), nB = norm(cross(sub(roofB[1], roofB[0]), sub(roofB[3], roofB[0])));
  const roofParts = [];
  for (const [y, n] of [[PY0, [0, -1, 0]], [PY1, [0, 1, 0]]]) if (vis(n)) roofParts.push(shape(gable(y), tone(n, WALLS), 1.2));
  for (const [q, n] of [[roofA, nA[2] < 0 ? nA.map(v => -v) : nA], [roofB, nB[2] < 0 ? nB.map(v => -v) : nB]]) if (vis(n)) roofParts.push(shape(q, tone(n, ROOF), 1.3));
  h += roofParts.join('');
  // door on the +x face, windows on the -y... drawn only when their face is toward the viewer
  if (vis([1, 0, 0])) h += shape([[PX1, PY0 + 4, GROUND], [PX1, PY0 + 9, GROUND], [PX1, PY0 + 9, GROUND + 7], [PX1, PY0 + 4, GROUND + 7]], DARK.m, 1);
  if (vis([1, 0, 0])) for (const y of [PY0 + 12, PY1 - 4]) h += shape([[PX1, y - 2.2, GROUND + 4], [PX1, y + 2.2, GROUND + 4], [PX1, y + 2.2, GROUND + 8], [PX1, y - 2.2, GROUND + 8]], '#cfe9f0', .9);
  parts.push({ box: [[PX0, PY0, GROUND], [PX1, PY1, PH + 6]], svg: h });

  // penstock: from an intake on the bank just upstream of the dam, along the bank, into the powerhouse's river side
  const PIPE_Z = GROUND + 2.4, PIPE_R = 1.6, PIPE_X = X0 - 3;
  const pA = [PIPE_X, Y1 + 4, PIPE_Z], pB = [PIPE_X, (PY0 + PY1) / 2, PIPE_Z], pC = [PX1, (PY0 + PY1) / 2, PIPE_Z];
  parts.push({ box: [[PIPE_X - 2, pB[1], GROUND], [PIPE_X + 2, pA[1], PIPE_Z + 2]], svg: rod(pA, pB, PIPE_R, METAL, tone, 1.2) + cyl(pA[0], pA[1], GROUND, PIPE_Z + 3, 2.4, CONCRETE, tone, 1.2, 16) });
  parts.push({ box: [[PX1, pC[1] - 2, GROUND], [PIPE_X, pC[1] + 2, PIPE_Z + 2]], svg: rod(pB, pC, PIPE_R, METAL, tone, 1.2) });
  // saddles under the run
  for (const y of [pA[1] - 6, pB[1] + 4]) parts.push({ box: [[PIPE_X - 1.4, y - 0.8, GROUND], [PIPE_X + 1.4, y + 0.8, PIPE_Z - PIPE_R]], svg: box(PIPE_X - 1.4, y - 0.8, GROUND, PIPE_X + 1.4, y + 0.8, PIPE_Z - PIPE_R, CONCRETE, tone, .9) });

  // transformer and a pole on the landward side of the powerhouse, wires up to the pole
  const TX0 = PX0 - 9, TY0 = PY0 + 3;
  let tr = castShadow([[TX0, TY0, GROUND], [TX0 + 6, TY0 + 7, GROUND], [TX0 + 3, TY0 + 3, GROUND + 9]], GROUND);
  tr += box(TX0 - 1, TY0 - 1, GROUND, TX0 + 7, TY0 + 8, GROUND + 1, CONCRETE, tone, .9);
  tr += box(TX0, TY0, GROUND + 1, TX0 + 6, TY0 + 7, GROUND + 7, METAL, tone, 1.3);
  for (const y of [TY0 + 1.5, TY0 + 3.5, TY0 + 5.5]) tr += cyl(TX0 + 3, y, GROUND + 7, GROUND + 9.5, 0.5, CERAMIC, toneI, .8, 10);
  parts.push({ box: [[TX0 - 1, TY0 - 1, GROUND], [TX0 + 7, TY0 + 8, GROUND + 10]], svg: tr });
  const POLE = [TX0 - 4, TY0 - 8];
  let po = castShadow([[POLE[0] - 1, POLE[1] - 1, GROUND], [POLE[0] + 1, POLE[1] + 1, GROUND], [POLE[0], POLE[1], GROUND + 24]], GROUND);
  po += cyl(POLE[0], POLE[1], GROUND, GROUND + 24, 0.8, BARK, tone, 1, 10);
  po += box(POLE[0] - 0.6, POLE[1] - 5, GROUND + 21, POLE[0] + 0.6, POLE[1] + 5, GROUND + 22.2, BARK, tone, .9);
  parts.push({ box: [[POLE[0] - 1, POLE[1] - 5, GROUND], [POLE[0] + 1, POLE[1] + 5, GROUND + 24]], svg: po });
  const wires = [[TY0 + 1.5, -4], [TY0 + 3.5, 0], [TY0 + 5.5, 4]].map(([y, dy]) => {
    const a = [TX0 + 3, y, GROUND + 9.5], b = [POLE[0], POLE[1] + dy, GROUND + 22.2];
    const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2 - 1.5];
    return `<path d="${pd([a, mid, b], false)}" fill="none" stroke="${INK}" stroke-width=".7"/>`;
  }).join('');
  parts.push({ box: [[POLE[0], POLE[1] - 5, GROUND + 9], [TX0 + 3, TY0 + 6, GROUND + 22.5]], svg: wires });
  return parts;
}

/* Water details that lie on the river: the lake behind the dam stands higher, foam below the spill, the tailrace. */
function waterDetails() {
  let s = '';
  // the lake: water tiles upstream of the dam, a little higher and darker
  for (let c = DAM_AT.col - 4; c < DAM_AT.col; c++) for (let r = DAM_AT.row - 1; r <= DAM_AT.row; r++) {
    if (!isWater(c, r)) continue;
    s += face(pd([W3(c, r, GROUND - 0.9), W3(c + 1, r, GROUND - 0.9), W3(c + 1, r + 1, GROUND - 0.9), W3(c, r + 1, GROUND - 0.9)]), WATER.m);
  }
  // tailrace: a short channel from the powerhouse's river side into the river
  const [ax, ay] = W3(DAM_AT.col + 1.4, DAM_AT.row - 1.6), [bx, by] = W3(DAM_AT.col + 2.0, DAM_AT.row - 1);
  s += face(pd([[ax, ay, GROUND - 1.5], [bx, ay, GROUND - 1.5], [bx, by, GROUND - 1.5], [ax, by, GROUND - 1.5]]), WATER.l);
  s += ink(pd([[ax, ay, GROUND], [bx, ay, GROUND], [bx, by, GROUND], [ax, by, GROUND]]), .8);
  // foam just below the dam
  for (let i = 0; i < 7; i++) {
    const [fx, fy] = W3(DAM_AT.col + 0.5 + (i % 3) * 0.25, DAM_AT.row - 0.8 + i * 0.25);
    s += `<path d="${pd(on(PZ(GROUND - 1.8), ellUV(fx, fy, 1.4, 0.9, 10)))}" fill="#ffffff" stroke="${INK}" stroke-width=".5"/>`;
  }
  return s;
}

function scene(st) {
  const parts = [...TREES.map(tree), ...plant()];
  return ground() + waterDetails() + byDepth(parts);
}

const ui = mountFigure({
  fig: '01', turn: 'full', title: ZOOM ? 'Micro hydro' : 'GridSim map', hint: 'drag to turn the map',
  size: ZOOM ? [ZOOM_BOX, ZOOM_BOX, 34] : [ROWS * T, COLS * T, 30], palette: 'mint',
  state: {},
  scene,
  readout: () => 'river, dam and powerhouse',
  buttons: [],
  credit: false,
});
</script></body></html>
